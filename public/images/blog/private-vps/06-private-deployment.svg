  <path d="M1110,541 h25 l10,-23 l17,47 l15,-29 h42" class="strong-line" />
  <rect x="748" y="480" width="245" height="155" rx="9" class="obj" />
  <rect x="761" y="493" width="12" height="12" class="nb" />
  <text x="767" y="502.5" class="nbt" text-anchor="middle">5</text>
  <text x="870" y="593" class="step-title" text-anchor="middle">PUBLISH PRIVATELY</text>
  <text x="870" y="615" class="step-sub" text-anchor="middle">VALIDATED HELPER / P2</text>
  <rect x="828" y="502" width="85" height="60" rx="7" class="thin" />
  <path d="M803,531 L853,531" class="flow" marker-end="url(#ar0)" />
  <rect x="453" y="480" width="245" height="155" rx="9" class="obj" />
  <rect x="466" y="493" width="12" height="12" class="nb" />
  <text x="472" y="502.5" class="nbt" text-anchor="middle">6</text>
  <text x="575" y="593" class="step-title" text-anchor="middle">CLIENT VERIFICATION</text>
  <text x="575" y="615" class="step-sub" text-anchor="middle">TLS / DEPLOYED BEHAVIOUR</text>
  <rect x="523" y="500" width="104" height="61" rx="4" class="thin" />
  <path d="M516,561 h118 l8,8 h-134 z" class="thin" />
  <path d="M1043,558 L993,558" class="flow" marker-end="url(#ar0)" />
  <path d="M748,558 L698,558" class="flow" marker-end="url(#ar0)" />
  <text x="1009" y="541" class="dts" text-anchor="middle">PASS</text>
  <rect x="1280" y="674" width="12" height="12" class="nb" />
  <text x="1286" y="683.5" class="nbt" text-anchor="middle">4</text>
  <text x="74" y="711" class="section-title">B · Amp runner startup</text>
  <text x="74" y="730" class="dts">A SAVED ACCOUNT MAY NOT BE THE ACTIVE ACCOUNT</text>
  <rect x="80" y="778" width="239" height="85" rx="9" class="obj" />
  <text x="199.5" y="815.5" class="node-title" text-anchor="middle">SELECT EXACT ACCOUNT</text>
  <text x="199.5" y="837.5" class="node-sub" text-anchor="middle">BEFORE AMP STARTS</text>
  <rect x="416" y="778" width="260" height="85" rx="9" class="obj" />
  <text x="546" y="815.5" class="node-title" text-anchor="middle">Amp runner starts</text>
  <text x="546" y="837.5" class="node-sub" text-anchor="middle">ACCOUNT SELECTED</text>
  <path d="M319,821 L416,821" class="flow" marker-end="url(#ar0)" />
  <text x="368" y="804" class="dts" text-anchor="middle">PASS</text>
  <rect x="74" y="895" width="12" height="12" class="nb" />
  <text x="80" y="904.5" class="nbt" text-anchor="middle">1</text>
  <text x="100" y="905" class="dts" text-anchor="start">IF THE ACCOUNT IS MISSING, THE MAIN PROCESS DOES NOT RUN.</text>
  <text x="794" y="747" class="section-title">C · FAILED LOCAL HEALTH</text>
  <text x="794" y="766" class="dts">DIAGNOSE BEFORE PUBLISHING</text>
  <rect x="811" y="809" width="210" height="73" rx="9" class="obj" />
  <text x="916" y="840.5" class="node-title" text-anchor="middle">STOP / DIAGNOSE</text>
  <text x="916" y="862.5" class="node-sub" text-anchor="middle">FIX THE APPLICATION</text>
  <path d="M1166,635 V845 H1021" class="dashed-flow" marker-end="url(#ar0)" />
  <text x="1183" y="767" class="dts" text-anchor="start">FAIL</text>
  <rect x="1247" y="665" width="12" height="12" class="nb" />
  <text x="1253" y="674.5" class="nbt" text-anchor="middle">3</text>
  <path d="M811,845 H713 V700 H416 V183 H870 V215" class="dashed-flow" marker-end="url(#ar0)" />
  <text x="708" y="724" class="dts" text-anchor="end">REBUILD AND RECHECK</text>
  <text x="800" y="950" class="dts" text-anchor="start">AMP RUNNER OPENS ITS CONTROL CONNECTION OUTBOUND.</text>
  <text x="1350" y="80" class="vt">DEPLOYMENT PORTS</text>
  <rect x="1350" y="88" width="48" height="24" class="thin" />
