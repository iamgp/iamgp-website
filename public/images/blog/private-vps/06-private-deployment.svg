  <rect x="1120" y="279" width="91" height="13" rx="2" class="thin" />
  <circle cx="1131" cy="285" r="1.5" class="dot" />
  <path d="M698,292 L748,292" class="flow" marker-end="url(#ar0)" />
  <path d="M993,292 L1043,292" class="flow" marker-end="url(#ar0)" />
  <path d="M1166,370 L1166,480" class="flow" marker-end="url(#ar0)" />
