  <line x1="556" y1="289" x2="595" y2="289" class="thin" />
  <rect x="748" y="215" width="245" height="155" rx="9" class="obj" />
  <rect x="761" y="228" width="12" height="12" class="nb" />
  <text x="767" y="237.5" class="nbt" text-anchor="middle">2</text>
  <text x="870" y="328" class="step-title" text-anchor="middle">BUILD IMAGE</text>
