  <rect x="20" y="20" width="1660" height="1020" rx="16" class="border" />
  <text x="50" y="58" class="nth">NOTES:</text>
  <rect x="50" y="78" width="12" height="12" class="nb" />
  <text x="56" y="87.5" class="nbt" text-anchor="middle">1</text>
  <text x="72" y="88" class="nt">SELECT THE INTENDED ACCOUNT AT STARTUP.</text>
  <rect x="50" y="102" width="12" height="12" class="nb" />
  <text x="56" y="111.5" class="nbt" text-anchor="middle">2</text>
  <text x="72" y="112" class="nt">BUILD AND RUN AS THE DEVELOPMENT USER.</text>
  <rect x="50" y="126" width="12" height="12" class="nb" />
  <text x="56" y="135.5" class="nbt" text-anchor="middle">3</text>
  <text x="72" y="136" class="nt">PASS LOCAL HEALTH BEFORE PUBLISHING.</text>
  <rect x="50" y="150" width="12" height="12" class="nb" />
  <text x="56" y="159.5" class="nbt" text-anchor="middle">4</text>
  <text x="72" y="160" class="nt">CHECK THE PREVIEW FROM AN AUTHORISED CLIENT.</text>
  <text x="440" y="62" class="section-title">A · Amp deployment sequence</text>
  <text x="440" y="81" class="dts">PROCEDURE / NOT AN EXECUTION LOG</text>
  <rect x="430" y="150" width="880" height="555" rx="12" class="zone" />
  <text x="445" y="174" class="node-sub">DEVELOPMENT USER / EXISTING SERVICES REMAIN SEPARATE</text>
