  <rect x="466" y="228" width="12" height="12" class="nb" />
  <text x="472" y="237.5" class="nbt" text-anchor="middle">1</text>
  <text x="575" y="328" class="step-title" text-anchor="middle">PROJECT SOURCE</text>
  <text x="575" y="350" class="step-sub" text-anchor="middle">INTENDED REVISION</text>
  <rect x="547" y="238" width="57" height="60" rx="2" class="thin" />
  <line x1="556" y1="256" x2="595" y2="256" class="thin" />
  <line x1="556" y1="267" x2="595" y2="267" class="thin" />
