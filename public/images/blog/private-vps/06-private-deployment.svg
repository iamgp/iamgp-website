  <polyline points="836,248 878,234.8 906,248 864,261.2 836,248 836,292 864,305.2 906,292 906,248 864,261.2 864,305.2" class="thin" />
  <line x1="878" y1="234.8" x2="878" y2="276.6" class="ph" />
  <rect x="1043" y="215" width="245" height="155" rx="9" class="obj" />
  <rect x="1056" y="228" width="12" height="12" class="nb" />
  <text x="1062" y="237.5" class="nbt" text-anchor="middle">3</text>
  <text x="1165" y="328" class="step-title" text-anchor="middle">START APPLICATION</text>
  <text x="1165" y="350" class="step-sub" text-anchor="middle">ROOTLESS DOCKER / LOOPBACK</text>
