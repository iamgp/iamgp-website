  <text x="1356" y="124" class="tc" text-anchor="start">P1</text>
  <rect x="1398" y="112" width="122" height="24" class="thin" />
  <text x="1459" y="124" class="tc" text-anchor="middle">host app ports</text>
  <rect x="1520" y="112" width="136" height="24" class="thin" />
  <text x="1588" y="124" class="tc" text-anchor="middle">3000 to 3999</text>
