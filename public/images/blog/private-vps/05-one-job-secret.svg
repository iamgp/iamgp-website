  <text x="56" y="87.5" class="nbt" text-anchor="middle">1</text>
  <text x="72" y="88" class="nt">THE GENERAL VAULT IDENTITY STAYS LOCAL.</text>
  <rect x="50" y="102" width="12" height="12" class="nb" />
  <text x="56" y="111.5" class="nbt" text-anchor="middle">2</text>
  <text x="72" y="112" class="nt">SEND THE SELECTED VALUE OVER SSH STDIN.</text>
  <rect x="50" y="126" width="12" height="12" class="nb" />
  <text x="56" y="135.5" class="nbt" text-anchor="middle">3</text>
  <text x="72" y="136" class="nt">THE RECEIVER ACCEPTS ONE NAMED FIELD.</text>
  <rect x="50" y="150" width="12" height="12" class="nb" />
  <text x="56" y="159.5" class="nbt" text-anchor="middle">4</text>
  <text x="72" y="160" class="nt">A FIXED COMMAND STARTS THE TEST JOB.</text>
  <rect x="50" y="174" width="12" height="12" class="nb" />
  <text x="56" y="183.5" class="nbt" text-anchor="middle">5</text>
  <text x="72" y="184" class="nt">THE DAEMON OWNER MAY INSPECT JOB VALUES.</text>
  <rect x="72" y="340" width="325" height="180" rx="10" class="well" />
  <circle cx="154" cy="407" r="18" class="thin" />
  <circle cx="154" cy="407" r="6" class="thin" />
  <path d="M172,407 h74 v13 h-12 v-13 m-17,0 v9 h-12 v-9" class="thin" />
  <text x="234" y="460" class="role" text-anchor="middle">VAULT ACCESS STAYS ON MAC</text>
  <rect x="359" y="483" width="12" height="12" class="nb" />
  <text x="365" y="492.5" class="nbt" text-anchor="middle">1</text>
  <text x="910" y="62" class="vt" text-anchor="middle">A · SELECTED-VALUE PATH</text>
  <text x="910" y="76" class="dts" text-anchor="middle">CLIENT VAULT ACCESS AND REMOTE JOB INPUT</text>
  <rect x="510" y="140" width="800" height="450" rx="12" class="zone" />
