  <text x="216" y="778.38" class="layer-sub" text-anchor="end">SELECTED VALUE</text>
  <text x="420" y="1000" class="vt" text-anchor="middle">REPRESENTATION STACK</text>
  <text x="420" y="1014" class="dts" text-anchor="middle">LOGICAL LAYERS</text>
