  <line x1="682.16" y1="891.88" x2="682.16" y2="755.88" class="ph" />
  <line x1="629.8" y1="964.26" x2="629.8" y2="828.26" class="ph" />
  <line x1="287.64" y1="902.38" x2="287.64" y2="766.38" class="ph" />
  <g transform="matrix(0.6579999999999999,0.119,-0.238,0.32899999999999996,340,830)">
