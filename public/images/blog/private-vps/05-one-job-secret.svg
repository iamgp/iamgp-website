  <g transform="matrix(0.6579999999999999,0.119,-0.238,0.32899999999999996,340,762)">
    <rect x="0" y="0" width="520" height="220" rx="12" class="obj" vector-effect="non-scaling-stroke" />
    <rect x="16" y="24" width="150" height="172" rx="12" class="hug" vector-effect="non-scaling-stroke" />
